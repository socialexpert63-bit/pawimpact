<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>PawImpact Platform (Demo)</title>
<style>
:root{--bg:#faf5ea;--card:#fffdf8;--ink:#14213d;--mut:#5d6578;--line:#e8dfcc;--co:#e8664a;--or:#f2994a;--teal:#2a9d8f;--sky:#dcebf5;--gray:#eceae4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101626;--card:#182036;--ink:#f3eee3;--mut:#9aa3b8;--line:#2a3452;--sky:#1d2d44;--gray:#222b44}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:flex;min-height:100vh}
nav{width:216px;padding:18px 12px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;flex:none;transition:width .2s}
nav.c{width:64px}nav.c .t{display:none}
.logo{font-weight:800;font-size:19px;padding:4px 10px 14px;display:flex;gap:8px;align-items:center}
nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;width:100%;color:var(--mut);font-weight:500}
nav button:hover{background:var(--gray)}nav button.on{background:var(--ink);color:var(--bg)}
nav button:focus-visible,.btn:focus-visible,.card:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
main{flex:1;min-width:0;padding:22px 28px 60px;max-width:1180px}
.banner{background:var(--sky);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:18px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}h2{font-size:17px;margin:26px 0 10px}
.sub{color:var(--mut);margin:0 0 18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card.k{cursor:pointer;transition:transform .15s}.card.k:hover{transform:translateY(-3px)}
.kpi b{font-size:28px;display:block;letter-spacing:-.02em}.kpi span{color:var(--mut);font-size:13px}
.up{color:var(--teal);font-size:13px;font-weight:600}
.btn{all:unset;cursor:pointer;background:var(--co);color:#fff;padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;display:inline-block}
.btn.s{background:var(--gray);color:var(--ink)}.btn:hover{filter:brightness(1.07)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mut);font-weight:500;padding:8px;border-bottom:1px solid var(--line)}td{padding:10px 8px;border-bottom:1px solid var(--line)}
.wrap{overflow-x:auto}
.bar{height:8px;background:var(--gray);border-radius:99px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--or));border-radius:99px;width:0;transition:width 1s ease}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--gray);display:inline-block}.tag.g{background:#2a9d8f26;color:var(--teal)}.tag.o{background:#e8664a26;color:var(--co)}
.cols{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.col{background:var(--gray);border-radius:14px;padding:10px;min-height:120px}.col h4{margin:0 0 8px;font-size:13px;color:var(--mut)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;font-size:13px;cursor:pointer}.chip:hover{border-color:var(--co)}
.dog{height:110px;border-radius:12px;display:grid;place-items:center;font-size:54px;margin-bottom:10px}
.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:9;padding:16px}.modal.o{display:grid}
.modal>div{background:var(--card);border-radius:20px;padding:22px;max-width:460px;width:100%;animation:pop .25s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.steps button{all:unset;cursor:pointer;padding:6px 12px;border-radius:99px;background:var(--gray);font-size:13px}.steps .on{background:var(--co);color:#fff}
.split{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
textarea,select,input[type=text],input:not([type]){width:100%;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
@media(max-width:700px){nav{width:58px}nav .t,.logo .t{display:none}main{padding:16px 14px 60px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hero{border-radius:24px;padding:48px 28px;background:linear-gradient(135deg,#14213d,#2a9d8f);color:#fff;position:relative;overflow:hidden}.hero h1{font-size:clamp(30px,5vw,50px);max-width:640px;line-height:1.1}.hero p{max-width:520px;opacity:.9}.hero .em{position:absolute;right:20px;bottom:-10px;font-size:130px;opacity:.25}
.sw{display:inline-block;width:42px;height:22px;border-radius:99px;background:var(--gray);position:relative;cursor:pointer;border:0;vertical-align:middle}.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}.sw.on{background:var(--teal)}.sw.on::after{left:23px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-right:6px;animation:pl 1s infinite alternate}@keyframes pl{to{opacity:.3}}
input{width:100%;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;margin:4px 0 10px}
.dh{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}.dc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.dc select,.dc input{width:auto;min-width:130px}
.dn{color:var(--co);font-size:13px;font-weight:600}.ic{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 11px;cursor:pointer;position:relative}.nb{position:absolute;top:-6px;right:-6px;background:var(--co);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px}
.bell{position:relative}.nm{position:absolute;right:0;top:44px;width:260px;z-index:8;box-shadow:0 8px 24px #0003}.nm div{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.nm button{margin-top:8px}
.chips2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.chips2 button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:99px;cursor:pointer}.chips2 .on{background:var(--ink);color:var(--bg)}
tr[tabindex]:hover{background:var(--gray)}#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:20;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
#ai-fab{position:fixed;right:18px;bottom:18px;z-index:14;box-shadow:0 6px 20px #0004;border-radius:99px;padding:12px 18px}
#ai-dr{position:fixed;top:0;right:0;bottom:0;width:min(390px,100%);background:var(--card);border-left:1px solid var(--line);z-index:15;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s;padding-top:env(safe-area-inset-top,0px)}#ai-dr.open{transform:none}
.ah{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.am{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{padding:10px 12px;border-radius:14px;max-width:92%;font-size:14px;line-height:1.5}.m.a{background:var(--gray)}.m.u{background:var(--ink);color:var(--bg);align-self:flex-end}
.aq{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px}.aq .ic{font-size:12px;padding:5px 10px}.af{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}.af input{margin:0}
.aib{display:flex;gap:8px;margin-top:14px}.aib input{margin:0}
</style></head><body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('o')"><div id="mbody"></div></div>
<script>
const $=s=>document.querySelector(s);const A=n=>(window.ASSETS&&ASSETS[n])||"assets/"+n+".svg";
const views=[["site","🌐","Public website"],["overview","📊","Overview"],["brands","🤝","Brands & sponsors"],["campaigns","📣","Campaigns"],["shelters","🐕","Shelters & dogs"],["content","🎬","Content studio"],["impact","📈","Impact analytics"],["journey","🧭","Campaign journey"],["ai","✨","AI assistant"],["auto","⚙️","Automation"]];
const S={view:"site",out:"",log:[],queue:[],rules:[["Sponsor deliverable overdue 3 days","AI drafts a follow-up email, then waits for your approval",1],["New adoption inquiry","Notify the shelter, create a follow-up task, flag it as an inquiry only",1],["Story approved by shelter","Schedule posts on Instagram, Facebook and YouTube",1],["Pledge marked received","Update funds received and draft a donor thank-you",0],["Campaign reaches 50%","Generate a sponsor progress report for review",1]],view0:1,step:0,inq:{},
 stages:["Identified","Contacted","Proposal","Negotiation","Active"],
 brands:[{n:"Hearth & Kibble Co.",c:"Pet food",s:0,v:60000},{n:"LeashLine Gear",c:"Accessories",s:1,v:25000},{n:"VetBright Labs",c:"Veterinary",s:2,v:40000},{n:"Pawsitive Retail",c:"Pet retail",s:3,v:80000},{n:"Wagtail Wellness",c:"Healthcare",s:4,v:50000}],
 dogs:[{n:"Biscuit",a:"3 yrs",b:"Lab mix",e:"🐕",bg:"#f2994a55",st:"Joined the shelter timid; now sits, stays and walks calmly on a lead.",tr:"Basic obedience 80%",sh:"Riverbend Rescue"},{n:"Juniper",a:"1 yr",b:"Shepherd mix",e:"🐕‍🦺",bg:"#2a9d8f44",st:"High-energy and eager. Loves puzzle toys and learning new tricks.",tr:"Leash skills 60%",sh:"Harbor Paws"},{n:"Maple",a:"6 yrs",b:"Beagle",e:"🐶",bg:"#e8664a44",st:"Gentle senior who greets every volunteer. Great with kids.",tr:"Calm greeting 95%",sh:"Riverbend Rescue"}],
 camps:[["Better Days for Shelter Dogs","Hearth & Kibble Co.","Riverbend Rescue","Adoption",72,"Active"],["Run With Rescue Marathon","Pawsitive Retail","Harbor Paws","Event",45,"Active"],["Back-to-Basics Youth Training","VetBright Labs","K9 Youth (demo)","Education",88,"Wrapping up"],["Bowl of Hope","Wagtail Wellness","Harbor Paws","Food donations",20,"Planning"]],
 content:["Idea","Script","Editing","Approval","Published"],
 items:[["Biscuit’s first week",0],["Marathon teaser reel",1],["Juniper training diary",2],["Sponsor thank-you post",3],["Maple adoption story",4]]};
function nav(){ $("#nav").innerHTML=`<div class="logo"><img src="${A('logo-mark')}" alt="" width="30" height="30"> <span class="t">PawImpact</span></div>`+views.map(v=>`<button class="${S.view==v[0]?"on":""}" onclick="go('${v[0]}')" title="${v[2]}">${v[1]}<span class="t">${v[2]}</span></button>`).join("")}
function go(v){S.view=v;nav();render();scrollTo(0,0)}
function modal(h){$("#mbody").innerHTML=h;$("#modal").classList.add("o")}
function close_(){$("#modal").classList.remove("o")}
const bar=p=>`<div class="bar"><i data-w="${p}"></i></div>`;
const kpi=(l,v,t,sfx="")=>`<div class="card kpi"><span>${l}</span><b data-n="${v}" data-s="${sfx}">0</b><span class="up">${t}</span></div>`;
const head=(t,s)=>`<div class="banner">Demo with fictional brands, dogs and figures. Nothing here is real sponsorship, donation or adoption data.</div><h1>${t}</h1><p class="sub">${s}</p>`;
const V={
overview:()=>head("Good morning, Muhammad","Your campaign command center. Commercial metrics are kept apart from nonprofit outcomes.")+
`<div class="grid">${kpi("Active campaigns",4,"▲ 1 vs last month")}${kpi("Brand partners",5,"▲ 2 vs last quarter")}${kpi("Sponsorship signed (USD)",255000,"▲ 12%","")}${kpi("Funds received (USD)",118400,"46% of signed")}${kpi("Dogs featured",12,"▲ 4")}${kpi("Community reach",486000,"▲ 18%")}</div>
<h2>Campaigns</h2><div class="card wrap"><table><tr><th>Campaign<th>Sponsor<th>Cause partner<th>Type<th>Progress<th>Status</tr>${S.camps.map(c=>`<tr><td><b>${c[0]}</b><td>${c[1]}<td>${c[2]}<td>${c[3]}<td style="width:140px">${bar(c[4])}<td><span class="tag ${c[5]=="Active"?"g":""}">${c[5]}</span></tr>`).join("")}</table></div>
<div class="split"><div><h2>Intelligence (simulated)</h2><div class="card">💡 “Better Days” has strong engagement but few sponsor conversions.<br><br>⏰ Two sponsor deliverables need follow-up this week.<br><br>⭐ Maple’s story is performing well and is worth promoting.</div></div>
<div><h2>Recent activity</h2><div class="card">✅ Marathon sponsor approved<br>🎬 Juniper diary moved to editing<br>🙋 6 new volunteers signed up<br>🐾 3 adoption inquiries for Biscuit</div></div></div>`,
brands:()=>head("Brands & sponsors","Click a brand to move it to the next pipeline stage.")+
`<div class="cols">${S.stages.map((st,i)=>`<div class="col"><h4>${st}</h4>${S.brands.map((b,j)=>b.s==i?`<div class="chip" onclick="adv(${j})" title="Advance stage"><b>${b.n}</b><br>${b.c}<br>$${b.v.toLocaleString()} proposed</div>`:"").join("")}</div>`).join("")}</div>
<h2>Sponsorship money, kept separate</h2><div class="grid">${kpi("Proposed (USD)",205000,"")}${kpi("Signed (USD)",50000,"")}${kpi("Invoiced (USD)",30000,"")}${kpi("Received (USD)",18000,"")}</div>`,
campaigns:()=>head("Campaigns","Cause marketing campaigns linking brands with shelters.")+
`<div class="grid">${S.camps.map((c,i)=>`<div class="card k" tabindex="0" onclick="camp(${i})"><div class="dog" style="height:80px;background:var(--sky)">${["🥣","🏃","🎓","🍽️"][i]}</div><b>${c[0]}</b><br><span style="color:var(--mut)">${c[1]} × ${c[2]}</span><div style="margin:10px 0">${bar(c[4])}</div><span class="tag">${c[3]}</span></div>`).join("")}</div>`,
shelters:()=>head("Shelters & dogs","Fictional dog profiles. An inquiry is not an adoption. Only the shelter can confirm one.")+
`<div class="grid">${S.dogs.map((d,i)=>`<div class="card k" tabindex="0" onclick="dog(${i})"><div class="dog" style="background:${d.bg}"><img src="${A('dog-'+(i+1))}" alt="Illustration of ${d.n}" style="height:100%"></div><b>${d.n}</b> <span class="tag">Demo</span><br><span style="color:var(--mut)">${d.a} · ${d.b} · ${d.sh}</span><div style="margin:8px 0">${bar(+d.tr.match(/\d+/)[0])}</div><small>${d.tr}</small></div>`).join("")}</div>
<h2>Inquiry register</h2><div class="card">${Object.keys(S.inq).length?Object.entries(S.inq).map(([k,v])=>`${S.dogs[k].n}: ${v} inquiry(ies), status: awaiting shelter follow-up<br>`).join(""):"No inquiries yet. Open a dog profile to add one."}</div>`,
content:()=>head("Content studio","Click a card to move it along. Publishing needs human approval.")+
`<div class="cols">${S.content.map((st,i)=>`<div class="col"><h4>${st}</h4>${S.items.map((it,j)=>it[1]==i?`<div class="chip" onclick="mv(${j})">${it[0]}</div>`:"").join("")}</div>`).join("")}</div>
<h2>Caption assistant (simulated)</h2><div class="card"><select id="tone"><option>Warm and hopeful</option><option>Playful</option><option>Direct call to action</option></select><br><br><button class="btn" onclick="gen()">Draft caption</button><div id="out" style="margin-top:12px"></div></div>`,
impact:()=>head("Impact analytics","Reach, funds and confirmed outcomes are never blended.")+
`<h2>Marketing reach</h2><div class="grid">${kpi("Impressions",1240000,"▲ 22%")}${kpi("Video views",182000,"▲ 9%")}${kpi("Click-throughs",24300,"▲ 14%")}</div>
<h2>Fundraising</h2><div class="grid">${kpi("Pledged (USD)",96000,"")}${kpi("Received (USD)",58200,"61% of pledges")}</div>
<h2>Animal welfare outcomes</h2><div class="grid">${kpi("Dogs featured",12,"")}${kpi("Adoption inquiries",47,"not adoptions")}${kpi("Adoptions confirmed by shelters",5,"")}</div>
<h2>Sponsor deliverables</h2><div class="card">${[["Logo on event bibs",100],["3 sponsored stories",67],["Impact report",30]].map(r=>`<div style="display:grid;grid-template-columns:150px 1fr;gap:10px;margin:8px 0">${r[0]}${bar(r[1])}</div>`).join("")}</div>`,
journey:()=>{const J=[["Brand partnership","Hearth & Kibble Co. (fictional) commits $60,000 over 6 months. Deliverables: logo placement, three sponsored stories, one event booth."],["Cause organization","Riverbend Rescue (fictional) has 38 dogs and needs visibility, enrichment toys and adoption-day volunteers."],["Campaign creation","Goal: 200 adoption inquiries. Audience: first-time dog owners. Channels: Instagram, YouTube, email. Timeline: Jan to Jun."],["Storytelling","Biscuit’s story: a timid arrival, 8 weeks of positive training, now ready for a home. Consent and shelter approval required before publishing."],["Distribution","Posting calendar: 3 posts a week. Simulated result: 212k impressions, 6.1% engagement."],["Community event","Adoption day: 140 attendees, 22 volunteers, sponsor branding on tents. Event 80% prepared."],["Fundraising","Pledged $24,000. Received $14,500. Pledges are not shown as received."],["Impact tracking","Engagement 6.1%. 3 shelters participating. 31 inquiries. 2 adoptions confirmed by shelter. $14,500 received."],["Final report","Report ready for Hearth & Kibble Co. and Riverbend Rescue. All figures are sample data."]];
return head("The campaign journey: Better Days for Shelter Dogs","Walk a fictional campaign from sponsorship to impact.")+`<div class="steps">${J.map((j,i)=>`<button class="${i==S.step?"on":""}" onclick="S.step=${i};render()">${i+1}. ${j[0]}</button>`).join("")}</div><div class="card"><h2 style="margin-top:0">${J[S.step][0]}</h2><p>${J[S.step][1]}</p><div>${bar((S.step+1)*100/9)}</div><br><button class="btn s" onclick="S.step=Math.max(0,S.step-1);render()">Back</button> <button class="btn" onclick="S.step=Math.min(8,S.step+1);render()">${S.step<8?"Next step":"Finish"}</button></div>`}};
const AIT=[["Campaign Strategy Assistant","Propose a concise campaign concept with objective, audience, channels and 3 KPIs."],["Social Media Assistant","Write 3 social captions with hashtags and a call to action."],["Brand Partnership Assistant","Write a short sponsorship proposal for a pet brand."],["Fundraising Copy Assistant","Write a warm fundraising email with subject line."],["Video Storytelling Assistant","Write a 5-scene video script with captions."],["Impact Reporting Assistant","Write an honest sponsor impact summary that separates reach, funds and confirmed adoptions."]];
const AIQ=["Create a shelter dog adoption campaign","Write a sponsorship proposal for a pet food brand","Write a dog transformation story for Biscuit","Write a fundraising email for the adoption day"];
V.site=()=>`<div class="hero"><div class="tag" style="background:#fff3;color:#fff">Pet industry cause marketing</div><h1>Good brands. Happy pets. Greater impact.</h1><p>Connect your brand with meaningful pet causes, powerful stories, and campaigns that make a difference.</p><br><button class="btn" onclick="go('campaigns')">Explore campaigns</button> <button class="btn s" onclick="partner()">Become a partner</button><div class="em">🐕</div></div>
<div class="banner" style="margin-top:14px">Demo concept with fictional brands, dogs and figures. Not an existing platform.</div>
<h2>Our mission</h2><p style="max-width:640px">We help pet brands, shelters and youth programs work together, so every sponsorship turns into stories people see and outcomes shelters can confirm.</p>
<h2>How PawImpact works</h2><div class="grid">${[["1. Partner","A brand and a shelter agree on goals and deliverables."],["2. Tell the story","Shelter dogs get consented, approved storytelling."],["3. Measure","Reach, funds received and confirmed adoptions are reported separately."]].map(x=>`<div class="card"><b>${x[0]}</b><br>${x[1]}</div>`).join("")}</div>
<h2>Everything in one platform</h2><div class="grid">${[["🤝","Brand partnerships","brands"],["📣","Campaign management","campaigns"],["🐕","Shelter and adoption","shelters"],["🎬","Content and storytelling","content"],["⚙️","Automation","auto"],["✨","AI assistant","ai"]].map(f=>`<div class="card k" tabindex="0" onclick="go('${f[2]}')"><div style="font-size:30px">${f[0]}</div><b>${f[1]}</b></div>`).join("")}</div>
<h2>Featured campaigns</h2><div class="grid">${S.camps.slice(0,3).map((c,i)=>`<div class="card k" tabindex="0" onclick="camp(${i})"><b>${c[0]}</b><br><span style="color:var(--mut)">Sponsor: ${c[1]}</span><div style="margin:10px 0">${bar(c[4])}</div><span class="tag g">${c[4]}% of goal (sample)</span></div>`).join("")}</div>
<h2>Story: Biscuit’s eight weeks</h2><div class="card" style="display:flex;gap:16px;align-items:center"><div class="dog" style="width:110px;flex:none;background:#f2994a55">🐕</div><div>${S.dogs[0].st} <br><a href="#" onclick="go('shelters');return false">Meet the dogs</a></div></div>
<h2>Let’s create something that makes a difference</h2><button class="btn" onclick="partner()">Become a sponsor</button> <button class="btn s" onclick="partner()">Partner with us</button>`;
function partner(){modal(`<h3>Partner with PawImpact</h3><label>Organization<input id="po"></label><label>Email<input id="pe" type="email"></label><button class="btn" onclick="if($('#po').value){$('#mbody').innerHTML='<h3>Thanks, request recorded</h3><p>Demo only. Nothing was sent.</p><button class=btn onclick=close_()>Close</button>'}">Send request</button> <button class="btn s" onclick="close_()">Cancel</button>`)}
V.ai=()=>head("PawImpact Intelligence","Create better campaigns, tell powerful stories, make a difference. Drafts are editable and need your approval.")+`<div class="card"><select id="tool">${AIT.map((t,i)=>`<option value="${i}">${t[0]}</option>`).join("")}</select><div style="margin:10px 0">${AIQ.map(q=>`<button class="btn s" style="margin:0 6px 6px 0" onclick="$('#q').value=this.textContent">${q}</button>`).join("")}</div><textarea id="q" rows="2" placeholder="What should we create?"></textarea><br><br><button class="btn" id="go" onclick="askAI()">Generate draft</button></div><h2>Draft (editable)</h2><div class="card"><textarea id="out" rows="10" placeholder="Your draft appears here."></textarea><br><br><button class="btn" onclick="approve()">Approve draft</button> <button class="btn s" onclick="dl()">Download as text</button> <span id="ast" class="tag o">Not approved. Nothing is sent or published automatically.</span></div>`;

$("#tb").innerHTML=L.length?L.map(o=>`<tr style="cursor:pointer" tabindex="0" onclick="camp(${o.i})"><td><b>${o.c[0]}</b><td>${o.c[1]}<td>${o.c[2]}<td>$${S.bud[o.i].toLocaleString()}<td style="width:130px">${bar(o.c[4])}<td><span class="tag ${o.c[5]=="Active"?"g":""}">${o.c[5]}</span></tr>`).join(""):`<tr><td colspan="6">No campaigns match. Clear the search or choose All.</tr>`;setTimeout(()=>document.querySelectorAll("#tb .bar i").forEach(e=>e.style.width=e.dataset.w+"%"),30)}

V.overview=()=>`<div class="dh"><div><h1>Good morning, Muhammad</h1><p class="sub" style="margin:0">Your campaign command center.</p></div><div class="dc"><select aria-label="Workspace" onchange="S.org=this.value;render()"><option value="com" ${S.org=="com"?"selected":""}>Commercial workspace</option><option value="np" ${S.org=="np"?"selected":""}>Nonprofit workspace</option></select><select aria-label="Reporting period" onchange="S.per=this.value;render()">${["30d","90d","12m"].map(p=>`<option ${S.per==p?"selected":""}>${p}</option>`).join("")}</select><input id="gs" aria-label="Search campaigns" placeholder="Search campaigns" value="${S.q.replace(/"/g,'&quot;')}" oninput="S.q=this.value;tbl()"><span class="bell"><button class="ic" onclick="S.nf=!S.nf;render()" aria-label="Notifications">🔔${S.nt.length?`<b class="nb">${S.nt.length}</b>`:""}</button>${S.nf?`<div class="nm card">${S.nt.length?S.nt.map(n=>`<div>${n}</div>`).join("")+`<button class="btn s" onclick="S.nt=[];S.nf=false;render()">Clear all</button>`:"You’re all caught up."}</div>`:""}</span></div></div>

function demoReply(q){q=q.toLowerCase();if(/attention|risk|behind|slow/.test(q))return"Bowl of Hope is furthest behind at 20% and still in planning. I’d confirm its sponsor deliverables this week. Better Days is healthy at 72% but converts few sponsors, so a short sponsor update could help.";if(/follow|deliverable|overdue/.test(q))return"Draft: “Hi team, a quick reminder that the logo placement for the marathon is due Nov 24. Could you send the final artwork by Friday? Thanks for your support!” Please review before sending.";if(/caption|instagram|post/.test(q))return"1) Biscuit arrived shy. Eight weeks later he’s ready for his forever sofa. 🐾\n2) Meet Juniper: 100% zoomies, 0% regrets.\n3) Maple greets every volunteer. Come say hello this Saturday.";if(/email|fundrais/.test(q))return"Subject: Help Maple find a home\n\nMaple is a gentle senior who greets every volunteer with a wag. Join our adoption day and help us reach our goal. Every pledge supports enrichment and care.";if(/story|dog|biscuit/.test(q))return"Biscuit arrived at Riverbend Rescue timid and unsure. With eight weeks of patient, positive training he learned to sit, stay and walk calmly. He’s ready for a home with a gentle family. (Fictional demo story. Needs shelter approval before publishing.)";return"This period: 4 active campaigns, 5 brand partners and 67% of deliverables complete. Reach is up on the previous period. Confirmed adoptions are tracked separately from inquiries.";}

d.className=S.chOpen?"open":"";d.innerHTML=`<div class="ah"><b>✨ PawImpact Intelligence</b><button class="ic" onclick="S.chOpen=false;chatUI()" aria-label="Close">✕</button></div><div class="am" id="am">${S.ch.length?S.ch.map((m,i)=>`<div class="m ${m.r}">${esc(m.t||"Thinking…")}${m.r=="a"&&m.t&&!m.busy?`<br><button class="btn s" style="margin-top:8px" onclick="S.queue.unshift('AI draft: '+S.ch[${i}].t.slice(0,50)+'…');toast('Added to the approval queue')">Send to approval queue</button>`:""}</div>`).join(""):`<div class="m a">Ask about campaigns, sponsors, dogs or content. I draft, you approve. Nothing is sent automatically.</div>`}</div><div class="aq">${QP().map(q=>`<button class="ic" onclick="aiAsk(this.textContent)">${q}</button>`).join("")}</div><div class="af"><input id="ai-in" placeholder="Ask anything…" aria-label="Ask PawImpact Intelligence" onkeydown="if(event.key=='Enter')aiAsk(this.value)"><button class="btn" onclick="aiAsk($('#ai-in').value)">Send</button></div>`;const m=$("#am");m.scrollTop=m.scrollHeight}

else{const t="(Simulated reply. Live AI works when this page is opened in Claude.)\n\n"+demoReply(q);for(let i=0;i<=t.length;i+=6){upd(t.slice(0,i));await new Promise(r=>setTimeout(r,12))}upd(t)}
